# ============================================
# 世尚门店订货系统 - Nginx 配置（HTTPS）
# 证书：Let's Encrypt（SAN 证书覆盖三个域名）
# 证书路径：/etc/letsencrypt/live/admin.shengshikunyuan.com/
# ============================================

# ============================================
# HTTP -> HTTPS 重定向
# ============================================
server {
    listen 80;
    server_name admin.shengshikunyuan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80 default_server;
    server_name api.shengshikunyuan.com;
    return 301 https://$host$request_uri;
}

server {
    listen 80;
    server_name shop.shengshikunyuan.com;
    return 301 https://$host$request_uri;
}

# ============================================
# 后台管理端（PC）- HTTPS
# ============================================
server {
    listen 443 ssl;
    server_name admin.shengshikunyuan.com;

    ssl_certificate /etc/letsencrypt/live/admin.shengshikunyuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.shengshikunyuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/admin;
    index index.html;

    # 前端路由 - SPA 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 PHP
    location /api/ {
        root /var/www/html/public;
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # 安全头
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
}

# ============================================
# API 站点（PHP）- HTTPS
# ============================================
server {
    listen 443 ssl default_server;
    server_name api.shengshikunyuan.com;

    ssl_certificate /etc/letsencrypt/live/admin.shengshikunyuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.shengshikunyuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/public;
    index index.php;

    # 上传大小
    client_max_body_size 50M;

    # PHP 处理
    location / {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        # 超时设置
        fastcgi_connect_timeout 60;
        fastcgi_send_timeout 60;
        fastcgi_read_timeout 60;
    }

    # 静态资源
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg)$ {
        expires 7d;
        access_log off;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }
}

# ============================================
# 门店端 H5（移动端商城）- HTTPS
# ============================================
server {
    listen 443 ssl;
    server_name shop.shengshikunyuan.com;

    ssl_certificate /etc/letsencrypt/live/admin.shengshikunyuan.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.shengshikunyuan.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    root /var/www/html/store;
    index index.html;

    # 前端路由 - SPA 模式
    location / {
        try_files $uri $uri/ /index.html;
    }

    # API 代理到 PHP
    location /api/ {
        try_files $uri $uri/ /index.php?s=$uri&$args;
    }

    # 静态资源缓存
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        expires 7d;
        access_log off;
    }

    # PHP 处理
    location ~ \.php$ {
        fastcgi_pass php:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME /var/www/html/public$fastcgi_script_name;
        include fastcgi_params;
    }
}
