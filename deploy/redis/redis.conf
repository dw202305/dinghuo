# Redis 配置（256MB 内存限制）
# 最大内存
maxmemory 200mb
maxmemory-policy allkeys-lru

# 持久化：开发环境用 RDB，生产可以加 AOF
save 900 1
save 300 10
save 60 10000

# RDB 文件
dbfilename dump.rdb
dir /data

# 网络
bind 0.0.0.0
protected-mode yes
# 凭证轮换后：redis.conf 不支持 ${VAR} 展开，部署时替换为 backend/.env [REDIS] PASSWORD 的值，切勿将真实口令提交入库
requirepass CHANGE_ME

# 日志
loglevel notice

# 连接
timeout 300
tcp-keepalive 60
