# Redis 配置（256MB 内存限制）
# 最大内存
maxmemory 200mb
maxmemory-policy allkeys-lru

# 持久化：开发环境用 RDB，生产可以加 AOF
save 900 1
save 300 10
save 60 10000

# RDB 文件
dbfilename dump.rdb
dir /data

# 网络
bind 0.0.0.0
protected-mode yes
requirepass ${REDIS_PASSWORD:-Redis@Shishang2026!}

# 日志
loglevel notice

# 连接
timeout 300
tcp-keepalive 60
