version: '3.8'

services:
  # ============================================
  # Nginx - 反向代理 + 静态资源
  # ============================================
  nginx:
    image: nginx:1.24-alpine
    container_name: ss-nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./nginx/ssl:/etc/nginx/ssl
      - ../backend/public:/var/www/html/public
      - ../frontend/store/dist:/var/www/html/store
      - ../frontend/admin/dist:/var/www/html/admin
    depends_on:
      - php
    deploy:
      resources:
        limits:
          memory: 64M

  # ============================================
  # PHP 8.1-FPM - ThinkPHP 8 应用
  # ============================================
  php:
    build:
      context: ./php
      dockerfile: Dockerfile
    container_name: ss-php
    restart: always
    volumes:
      - ../backend:/var/www/html
    working_dir: /var/www/html
    environment:
      - APP_ENV=production
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_DATABASE=shishang_order
      - DB_USERNAME=shishang
      - DB_PASSWORD=${DB_PASSWORD:-Shishang@2026!}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512M

  # ============================================
  # MySQL 8.0 - 主数据库（内存受限配置）
  # ============================================
  mysql:
    image: mysql:8.0
    container_name: ss-mysql
    restart: always
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./mysql/my.cnf:/etc/mysql/conf.d/custom.cnf
    environment:
      - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-Root@Shishang2026!}
      - MYSQL_DATABASE=shishang_order
      - MYSQL_USER=shishang
      - MYSQL_PASSWORD=${DB_PASSWORD:-Shishang@2026!}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1G

  # ============================================
  # Redis 7 - 缓存 + 会话 + 分布式锁
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: ss-redis
    restart: always
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf
    command: redis-server /usr/local/etc/redis/redis.conf
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local

# 总内存分配：nginx 64M + php 512M + mysql 1G + redis 256M = ~1.8G
# 剩余约 2.2G 留给系统 + Docker 运行时 + 临时编译任务
